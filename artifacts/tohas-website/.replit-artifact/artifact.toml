kind = "web"
previewPath = "/"
title = "TohasProTrade Website"
version = "1.0.0"
id = "artifacts/tohas-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24241

[services.development]
run = "pnpm --filter @workspace/tohas-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tohas-website", "run", "build" ]
publicDir = "artifacts/tohas-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24241"
BASE_PATH = "/"
